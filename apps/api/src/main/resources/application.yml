spring:
  application:
    name: human-proxy-api
  datasource:
    url: "${SPRING_DATASOURCE_URL:jdbc:h2:mem:human_proxy;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}"
    username: ${SPRING_DATASOURCE_USERNAME:sa}
    password: ${SPRING_DATASOURCE_PASSWORD:}
  flyway:
    enabled: ${SPRING_FLYWAY_ENABLED:false}
    locations: classpath:db/migration
management:
  endpoint:
    health:
      probes:
        enabled: true
  endpoints:
    web:
      exposure:
        include: health,info
server:
  port: ${SERVER_PORT:8080}

security:
  agent:
    signing-secret: ${HP_AGENT_SIGNING_SECRET:hp-dev-signing-secret}
    allowed-api-keys: ${HP_AGENT_ALLOWED_API_KEYS:}
    timestamp-skew-seconds: ${HP_AGENT_TIMESTAMP_SKEW_SECONDS:300}
  latpeed:
    signing-secret: ${HP_LATPEED_SIGNING_SECRET:latpeed-dev-signing-secret}
