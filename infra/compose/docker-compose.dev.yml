services:
  postgres:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-human_proxy}
      POSTGRES_USER: ${POSTGRES_USER:-human_proxy}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - hp_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-human_proxy} -d ${POSTGRES_DB:-human_proxy}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - internal

  api:
    image: ${API_IMAGE:-human-proxy-api}:${IMAGE_TAG:-local}
    build:
      context: ../../apps/api
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}
      SPRING_DATASOURCE_URL: ${SPRING_DATASOURCE_URL:-jdbc:postgresql://postgres:5432/human_proxy}
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME:-human_proxy}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD:?SPRING_DATASOURCE_PASSWORD is required}
      SPRING_FLYWAY_ENABLED: ${SPRING_FLYWAY_ENABLED:-true}
      SERVER_PORT: 8080
    expose:
      - "8080"
    networks:
      - internal

  web:
    image: ${WEB_IMAGE:-human-proxy-web}:${IMAGE_TAG:-local}
    build:
      context: ../../apps/web
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      - api
    environment:
      NODE_ENV: production
      PORT: 3000
      API_BASE_URL: ${API_BASE_URL:-http://api:8080}
    expose:
      - "3000"
    networks:
      - internal

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      - web
      - api
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ../../.runtime/nginx/conf.d:/etc/nginx/conf.d:ro
      - ../../.runtime/nginx/acme:/var/www/certbot
      - ../../.runtime/nginx/certs:/etc/nginx/certs:ro
    networks:
      - internal

volumes:
  hp_postgres_data:

networks:
  internal:
