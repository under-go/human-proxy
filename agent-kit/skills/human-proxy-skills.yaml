version: 1
provider: human-proxy
base_url: https://api.human-proxy.example.com
headers:
  required:
    - X-HP-API-KEY
    - X-HP-TIMESTAMP
    - X-HP-NONCE
    - X-HP-SIGNATURE

skills:
  - id: hp.create_task
    description: 사람 수행이 필요한 작업을 등록한다.
    method: POST
    path: /v1/agent/tasks
    idempotent: true
    idempotency_header: Idempotency-Key
    input_schema:
      type: object
      required: [spec, reward]
      properties:
        spec:
          type: object
          required: [prompt, expectedOutput, category, deadlineAt]
        reward:
          type: object
          required: [amountKrw, feeKrw]
    success_criteria:
      - taskId를 수신한다.
      - 초기 status를 수신한다.

  - id: hp.get_task
    description: 작업 상태를 조회한다.
    method: GET
    path: /v1/agent/tasks/{taskId}
    input_schema:
      type: object
      required: [taskId]
      properties:
        taskId:
          type: string

  - id: hp.review_task
    description: 제출물을 승인/수정요청/거절한다.
    method: POST
    path: /v1/agent/tasks/{taskId}/review
    idempotent: true
    idempotency_header: Idempotency-Key
    input_schema:
      type: object
      required: [taskId, decision]
      properties:
        taskId:
          type: string
        decision:
          type: string
          enum: [APPROVED, REVISION_REQUESTED, REJECTED]
        reason:
          type: string

  - id: hp.subscribe_webhook
    description: 작업/정산 이벤트 웹훅을 등록한다.
    method: POST
    path: /v1/agent/webhooks/subscriptions
    idempotent: true
    idempotency_header: Idempotency-Key
    input_schema:
      type: object
      required: [url]
      properties:
        url:
          type: string

  - id: hp.get_ledger
    description: 원장 내역을 조회한다.
    method: GET
    path: /v1/wallet/ledger

  - id: hp.get_settlements
    description: 정산 상태를 조회한다.
    method: GET
    path: /v1/settlements

guidelines:
  - 쓰기 요청은 반드시 Idempotency-Key를 사용한다.
  - 웹훅 이벤트는 중복 수신 가능성을 가정해 처리한다.
  - 승인 결정은 합격 기준 충족 여부를 근거로 남긴다.
